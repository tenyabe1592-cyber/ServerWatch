[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "serverwatch"
version = "1.0.0"
description = "ServerWatch M1: bounded single-server health and incident monitoring"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.119.0",
  "psutil==7.1.0",
  "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
serverwatch = ["static/*"]

[tool.setuptools.packages.find]
include = ["serverwatch*"]
exclude = ["tests*", "deploy*"]
